[project]
name = "SpySWAT"
version = "0.2.6"
description = "Calibration, validation, sensitivity analysis and scenario runs for SWAT models"
readme = "README.md"

authors = [
    { name = "Wosonday" }
]

maintainers = [
    { email = "thanhsonmttn@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyodbc>=5.3.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.0",
]

# Đăng ký CLI command — sau khi pip install spyswat, user gõ "spyswat" là chạy
[project.scripts]
spyswat = "spyswat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spyswat"]

# Ship only the package, tests, samples and user docs (no IDE files, agent notebook,
# SWAT executable, local parameter files or pytest temp dirs).
[tool.hatch.build.targets.sdist]
include = [
    "/spyswat",
    "/tests",
    "/docs/sample_*.py",
    "/README.md",
    "/README_VI.md",
    "/CHANGELOG.md",
    "/ARCHITECTURE.md",
]
exclude = [
    "__pycache__",
    "/tests/test_harness_markdown.py",
    "/tests/test_harness_routing.py",
    "/tests/test_guardrail_examples.py",
    "/tests/test_skill_routing.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

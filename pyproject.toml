[project]
name = "SpySWAT"
version = "0.1.1"

authors = [
    { name = "Wosonday" }
]

maintainers = [
    { email = "thanhsonmttn@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyodbc>=5.3.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

# Đăng ký CLI command — sau khi pip install spyswat, user gõ "spyswat" là chạy
[project.scripts]
spyswat = "spyswat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spyswat"]